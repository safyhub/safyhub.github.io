<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Encuentra SAFY HUB en YouTube, Instagram, TikTok y Facebook.">
  <title>SAFY HUB | Todas nuestras redes</title>
  <style>
    :root { color-scheme: dark; --bg:#101114; --panel:#1a1c21; --muted:#aeb2bd; --white:#fff; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; padding:28px 16px;
      display:grid; place-items:center;
      background:radial-gradient(ellipse at top, #292d38 0, #101114 55%);
      color:var(--white); font-family:Arial,Helvetica,sans-serif;
    }
    main { width:min(100%,440px); text-align:center; }
    .logo {
      width:94px;height:94px;margin:0 auto 18px;border-radius:28px;
      display:grid;place-items:center;background:#fff;color:#111;
      font-weight:900;font-size:25px;letter-spacing:-1.5px;
      box-shadow:0 12px 36px #0008;
    }
    h1 { margin:0; font-size:34px; letter-spacing:2px; }
    .tagline { margin:9px 0 28px;color:var(--muted);font-size:15px; }
    .links { display:grid; gap:12px; }
    a {
      min-height:62px;padding:0 19px;border-radius:16px;
      display:flex;align-items:center;gap:14px;text-decoration:none;
      background:var(--panel);border:1px solid #ffffff16;color:#fff;
      font-size:17px;font-weight:700;transition:transform .15s,border-color .15s;
    }
    a:hover { transform:translateY(-2px);border-color:#ffffff66; }
    .icon { width:30px;font-size:24px; }
    .arrow { margin-left:auto;color:#aeb2bd;font-size:20px; }
    .note { margin:25px 0 0;color:#858a96;font-size:12px; }
    footer { margin-top:25px;color:#777d88;font-size:12px;letter-spacing:1px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="SAFY HUB">SAFY<br>HUB</div>
    <h1>SAFY HUB</h1>
    <p class="tagline">¡Síguenos y descubre todo lo que compartimos!</p>
    <nav class="links" aria-label="Redes sociales de SAFY HUB">
      <a href="https://youtube.com/@safyhub" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">▶</span><span>YouTube</span><span class="arrow">↗</span>
      </a>
      <a href="https://www.instagram.com/safyhub" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">◎</span><span>Instagram</span><span class="arrow">↗</span>
      </a>
      <a href="https://www.tiktok.com/@safyhub" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">♪</span><span>TikTok</span><span class="arrow">↗</span>
      </a>
      <a href="https://www.facebook.com/safyhub" target="_blank" rel="noopener noreferrer">
        <span class="icon" aria-hidden="true">f</span><span>Facebook</span><span class="arrow">↗</span>
      </a>
    </nav>
    <p class="note">Un solo lugar para encontrarnos en todas nuestras redes.</p>
    <footer>SAFY HUB · CONECTA CON NOSOTROS</footer>
  </main>
</body>
</html>
